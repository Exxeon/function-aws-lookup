name: CI

on:
  push:
    branches:
      - main
      - release-*
    tags:
      - 'v*'
  pull_request: {}
  workflow_dispatch:
    inputs:
      version:
        description: Package version (e.g. v0.1.0 or v0.1.0-rc.1); leave empty for a development build
        type: string
        required: false

env:
  # Common versions
  GO_VERSION: '1.26.0'
  GOLANGCI_VERSION: 'v2.12.0'
  DOCKER_BUILDX_VERSION: 'v0.24.0'
  GIT_CLIFF_VERSION: '2.14.2'

  # Lowercased before publishing because registry names cannot contain capitals.
  XPKG: ghcr.io/${{ github.repository }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@${{ env.GIT_CLIFF_VERSION }}

      - name: Validate Release Configuration
        run: git-cliff --unreleased --bump --context > /dev/null

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false  # The golangci-lint action does its own caching.

      - name: Check go mod tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_VERSION }}

  # Every commit in a pull request needs a Developer Certificate of Origin
  # sign-off from its author. See CONTRIBUTING.md.
  dco:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check Sign-offs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          missing=0
          for commit in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            email=$(git log -1 --format='%ae' "$commit")
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$commit" | grep -qiF "<$email>"; then
              echo "::error::Commit $(git log -1 --format='%h %s' "$commit") has no 'Signed-off-by:' trailer for $email. Sign off with 'git commit -s'; see CONTRIBUTING.md."
              missing=1
            fi
          done
          exit "$missing"

  unit-test:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run Unit Tests
        run: go test -v -cover ./...

  # We want to build most packages for the amd64 and arm64 architectures. To
  # speed this up we build single-platform packages in parallel. We then upload
  # those packages to GitHub as a build artifact. The push job downloads those
  # artifacts and pushes them as a single multi-platform package.
  build:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: true
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: ${{ env.DOCKER_BUILDX_VERSION }}

      - name: Checkout
        uses: actions/checkout@v7

      # We ask Docker to use GitHub Action's native caching support to speed up
      # the build, per https://docs.docker.com/build/cache/backends/gha/.
      - name: Build Runtime
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: image
          build-args:
            GO_VERSION=${{ env.GO_VERSION }}
          outputs: type=docker,dest=runtime-${{ matrix.arch }}.tar

      - name: Setup the Crossplane CLI
        run: "curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh"

      - name: Build Package
        run: ./crossplane xpkg build --package-file=${{ matrix.arch }}.xpkg --package-root=package/ --embed-runtime-image-tarball=runtime-${{ matrix.arch }}.tar

      - name: Upload Single-Platform Package
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.arch }}
          path: "*.xpkg"
          if-no-files-found: error
          retention-days: 1

  # This job downloads the single-platform packages built by the build job, and
  # pushes them as a multi-platform package.
  push:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-26.04
    # Calculate versions after acquiring the lock and fetching current tags.
    concurrency:
      group: ghcr-publishing
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    needs:
      - lint
      - unit-test
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup git-cliff for Automatic Versioning
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@${{ env.GIT_CLIFF_VERSION }}

      - name: Set Package Version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          # Manual runs and tag pushes can name any commit. Only publish ones
          # that went through review: on main, or on a release-* branch.
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || "$GITHUB_REF_TYPE" == tag ]]; then
            reviewed=false
            for branch in $(git for-each-ref --format='%(refname)' refs/remotes/origin/main 'refs/remotes/origin/release-*'); do
              if git merge-base --is-ancestor "$GITHUB_SHA" "$branch"; then
                reviewed=true
                break
              fi
            done
            if [[ "$reviewed" != true ]]; then
              echo "::error::Only commits on main or a release-* branch can be published. Merge the change first."
              exit 1
            fi
          fi

          version="$REQUESTED_VERSION"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ -n "$version" && "$version" != "$GITHUB_REF_NAME" ]]; then
              echo "::error::The requested version must match the Git tag."
              exit 1
            fi
            version="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            # Release only when git-cliff finds changes, or retry a tag at HEAD.
            version=$(git-cliff --use-branch-tags --unreleased --bump --context |
              jq -r --arg sha "$GITHUB_SHA" '.[0] | select((.commits | length) > 0 or .previous.commit_id == $sha) | .version // empty')
          fi

          if [[ -n "$version" ]]; then
            # SemVer without build metadata, which OCI tags cannot represent.
            number='(0|[1-9][0-9]*)'
            identifier="($number|[0-9]*[A-Za-z-][0-9A-Za-z-]*)"
            semver="^v$number\\.$number\\.$number(-$identifier(\\.$identifier)*)?$"
            if [[ ! "$version" =~ $semver || ${#version} -gt 128 ]]; then
              echo "::error::Use a version such as v0.1.0 or v0.1.0-rc.1 (at most 128 characters, without build metadata)."
              exit 1
            fi
            # A release tag must always identify the commit being published.
            if git show-ref --verify --quiet "refs/tags/$version"; then
              tagged_commit=$(git rev-parse "refs/tags/$version^{commit}")
              if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
                echo "::error::The release tag already points to a different commit."
                exit 1
              fi
            fi
            echo "RECORD_RELEASE_TAG=true" >> "$GITHUB_ENV"
          else
            timestamp=$(date -u -d "@$(git show -s --format=%ct)" +%Y%m%d%H%M%S)
            version="v0.0.0-$timestamp-$(git rev-parse --short=12 HEAD)"
          fi

          echo "XPKG_VERSION=$version" >> "$GITHUB_ENV"

      - name: Download Single-Platform Packages
        uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: .
          merge-multiple: true

      - name: Setup the Crossplane CLI
        run: "curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Reserve the version before publishing; a failed push must not allow a
      # later commit to overwrite that version. Retries reuse the existing tag.
      - name: Record Release Tag
        if: env.RECORD_RELEASE_TAG == 'true'
        shell: bash
        run: |
          if ! git show-ref --verify --quiet "refs/tags/$XPKG_VERSION"; then
            git -c tag.gpgsign=false tag "$XPKG_VERSION" "$GITHUB_SHA"
          fi
          git push origin "refs/tags/$XPKG_VERSION"

      # GITHUB_TOKEN tag pushes do not trigger another workflow. Publish here
      # so no second build or extra token is needed.
      - name: Push Multi-Platform Package to GitHub Container Registry
        shell: bash
        run: |
          package="${XPKG,,}:$XPKG_VERSION"
          ./crossplane --verbose xpkg push --package-files=amd64.xpkg,arm64.xpkg "$package"
          echo "Published \`$package\` for linux/amd64 and linux/arm64." >> "$GITHUB_STEP_SUMMARY"
