# Credentials for crossplane render --function-credentials. Use real
# credentials to try a lookup against AWS.
apiVersion: v1
kind: Secret
metadata:
  name: aws-creds
  namespace: crossplane-system
type: Opaque
stringData:
  credentials: |
    [default]
    aws_access_key_id = REPLACE_ME
    aws_secret_access_key = REPLACE_ME
